[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-experiment"
version = "0.1.0"
description = "MATE: Marker-Affordance Test Environment"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
